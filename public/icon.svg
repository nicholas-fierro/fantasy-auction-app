<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background, no rounded corners of its own: iOS and Android both
       apply their own mask. Matches the manifest's background_color. -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <!-- All artwork stays inside the middle 60% (r <= 154 from center) so Android's
       circle/squircle maskable crop never clips it. -->
  <g transform="rotate(-35 256 256)">
    <ellipse cx="256" cy="256" rx="146" ry="94" fill="#f59e0b"/>
    <!-- Seams -->
    <path d="M133 210 A 170 170 0 0 1 133 302" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <path d="M379 210 A 170 170 0 0 0 379 302" fill="none" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <!-- Laces -->
    <line x1="196" y1="256" x2="316" y2="256" stroke="#0a0a0a" stroke-width="12" stroke-linecap="round"/>
    <g stroke="#0a0a0a" stroke-width="12" stroke-linecap="round">
      <line x1="216" y1="232" x2="216" y2="280"/>
      <line x1="246" y1="228" x2="246" y2="284"/>
      <line x1="276" y1="228" x2="276" y2="284"/>
      <line x1="306" y1="232" x2="306" y2="280"/>
    </g>
  </g>
</svg>
